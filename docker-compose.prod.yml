# ============================================
# Project Harness · 生产环境部署（云服务器 + HTTPS）
# ============================================

services:
  db:
    image: postgres:16-alpine
    container_name: harness-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: harness
    volumes:
      - /data/harness/pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - harness-net

  backend:
    build: ./backend
    container_name: harness-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://harness:${POSTGRES_PASSWORD}@db:5432/harness
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - /data/harness/uploads:/app/uploads
      # 宿主机监控（只读）
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/os-release:ro
      - /etc/hostname:/host/etc-hostname:ro
    networks:
      - harness-net

  frontend:
    build: ./frontend
    container_name: harness-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - /data/harness/uploads:/usr/share/nginx/html/uploads:ro
      # SSL 证书 + ACME 验证
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - harness-net

networks:
  harness-net:
    driver: bridge
