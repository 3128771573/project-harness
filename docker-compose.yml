services:
  db:
    image: postgres:16-alpine
    container_name: harness-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness_dev_pw}
      POSTGRES_DB: harness
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - harness-net

  backend:
    build: ./backend
    container_name: harness-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://harness:${POSTGRES_PASSWORD:-harness_dev_pw}@db:5432/harness
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-please}
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://10.166.245.50:8080}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - harness-net

  frontend:
    build: ./frontend
    container_name: harness-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - harness-net

volumes:
  pgdata:

networks:
  harness-net:
    driver: bridge
