services:
  db:
    image: postgres:16-alpine
    container_name: harness-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: harness
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - harness-net

  backend:
    build: ./backend
    container_name: harness-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://harness:${POSTGRES_PASSWORD}@db:5432/harness
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    networks:
      - harness-net

  frontend:
    build: ./frontend
    container_name: harness-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    volumes:
      - uploads:/usr/share/nginx/html/uploads:ro
    networks:
      - harness-net

volumes:
  pgdata:
  uploads:

networks:
  harness-net:
    driver: bridge
